name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: gosec -tests -include=G201,G202 ./cmd/... ./internal/...
