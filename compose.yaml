services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Dev-Postgres-Admin!2026}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    # PostgreSQL remains isolated from application traffic, but needs a
    # non-internal bridge network for its loopback-only host port mapping.
    networks: [internal, host-access]

  db-init:
    build:
      context: .
      target: db-init
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-Dev-Postgres-Admin!2026}
      CONTROL_DATABASE: ${CONTROL_DATABASE:-card_issuer_control}
      SHARD_DATABASE: ${SHARD_DATABASE:-card_issuer_shard_01}
      SHARD_ID: ${SHARD_ID:-shard_01}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-Dev-Control-Reader!2026}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-Dev-Auth-Runtime!2026}
      SHARD_DB_PASSWORD: ${SHARD_DB_PASSWORD:-Dev-Shard-Runtime!2026}
      EXECUTOR_DB_PASSWORD: ${EXECUTOR_DB_PASSWORD:-Dev-Executor-Runtime!2026}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  pki-init:
    build:
      context: .
      target: localpki
    environment:
      LOCAL_PKI_DIR: /pki
    volumes:
      - ./.local/authorization-pki:/pki
    restart: "no"
    networks: [internal]

  devvault:
    build:
      context: .
      target: devvault
    environment:
      APP_ENV: development
      DEV_VAULT_ADDR: ":8081"
      TEST_VAULT_KEY_B64: ${TEST_VAULT_KEY_B64:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI}
    healthcheck:
      test: ["CMD", "/card-issuer-devvault", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]

  app:
    build:
      context: .
      target: app
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: development
      # Functional tests share one container source IP and require more than the production default of five attempts/minute.
      LOGIN_ATTEMPT_LIMIT_PER_MINUTE: ${LOGIN_ATTEMPT_LIMIT_PER_MINUTE:-100}
      CREDENTIAL_VAULT_MODE: development
      DEVELOPMENT_VAULT_URL: http://devvault:8081
      PGHOST: postgres
      PGPORT: "5432"
      PGSSLMODE: disable
      CONTROL_DATABASE: ${CONTROL_DATABASE:-card_issuer_control}
      SHARD_DATABASE: ${SHARD_DATABASE:-card_issuer_shard_01}
      CONTROL_DB_USER: ci_app_control
      AUTH_DATABASE: ${AUTH_DATABASE:-card_issuer_control}
      AUTH_DB_USER: ci_app_auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-Dev-Auth-Runtime!2026}
      SHARD_DB_USER: ci_app_shard
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-Dev-Control-Reader!2026}
      SHARD_DB_PASSWORD: ${SHARD_DB_PASSWORD:-Dev-Shard-Runtime!2026}
      # POC-only public development key; must never be used in production.
      AUTH_JWT_PRIVATE_KEY_B64: ${AUTH_JWT_PRIVATE_KEY_B64:-nWGxne/9WmC6hEr0kuwsxERJxWl7MmkZcDusAxyuf2DXWpgBgrEKt9VL/tPJZAc6DuFy89qmIyWvAhpo9wdRGg}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-card-issuer-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-card-issuer-api}
      # POC-only public development cursor key; must never be used in production.
      API_CURSOR_HMAC_KEY_B64: ${API_CURSOR_HMAC_KEY_B64:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      # POC-only public development idempotency key; production requires a unique secret distinct from the cursor key.
      API_IDEMPOTENCY_HMAC_KEY_B64: ${API_IDEMPOTENCY_HMAC_KEY_B64:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      devvault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/card-issuer-api", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal, frontend]

  authorization:
    build:
      context: .
      target: authorization
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      CREDENTIAL_VAULT_MODE: development
      DEVELOPMENT_VAULT_URL: http://devvault:8081
      PGHOST: postgres
      PGPORT: "5432"
      PGSSLMODE: disable
      CONTROL_DATABASE: ${CONTROL_DATABASE:-card_issuer_control}
      SHARD_DATABASE: ${SHARD_DATABASE:-card_issuer_shard_01}
      CONTROL_DB_USER: ci_app_control
      AUTH_DATABASE: ${AUTH_DATABASE:-card_issuer_control}
      AUTH_DB_USER: ci_app_auth
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-Dev-Auth-Runtime!2026}
      SHARD_DB_USER: ci_app_shard
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-Dev-Control-Reader!2026}
      SHARD_DB_PASSWORD: ${SHARD_DB_PASSWORD:-Dev-Shard-Runtime!2026}
      API_CURSOR_HMAC_KEY_B64: ${API_CURSOR_HMAC_KEY_B64:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      API_IDEMPOTENCY_HMAC_KEY_B64: ${API_IDEMPOTENCY_HMAC_KEY_B64:-AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE}
      AUTH_JWT_PRIVATE_KEY_B64: ${AUTH_JWT_PRIVATE_KEY_B64:-nWGxne/9WmC6hEr0kuwsxERJxWl7MmkZcDusAxyuf2DXWpgBgrEKt9VL/tPJZAc6DuFy89qmIyWvAhpo9wdRGg}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-card-issuer-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-card-issuer-api}
      AUTHORIZATION_HTTP_ADDR: ":8443"
      AUTHORIZATION_TLS_CERT_FILE: /pki/authorization-server.pem
      AUTHORIZATION_TLS_KEY_FILE: /pki/authorization-server-key.pem
      AUTHORIZATION_SERVER_CA_FILE: /pki/server-ca.pem
      AUTHORIZATION_CLIENT_CA_FILE: /pki/client-ca.pem
      AUTHORIZATION_CLIENT_CERTIFICATES_FILE: /pki/client-certificates.json
      AUTHORIZATION_HEALTH_CERT_FILE: /pki/bank-client.pem
      AUTHORIZATION_HEALTH_KEY_FILE: /pki/bank-client-key.pem
    volumes:
      - ./.local/authorization-pki:/pki:ro
    ports:
      - "127.0.0.1:${AUTHORIZATION_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      pki-init:
        condition: service_completed_successfully
      devvault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/card-issuer-authorization", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal, frontend]

  executor:
    build:
      context: .
      target: executor
    environment:
      EXECUTOR_ID: ${EXECUTOR_ID:-executor-dev-01}
      EXECUTOR_HTTP_ADDR: ":8090"
      EXECUTOR_CONTROL_DATABASE_URL: postgres://ci_app_executor:${EXECUTOR_DB_PASSWORD:-Dev-Executor-Runtime!2026}@postgres:5432/${CONTROL_DATABASE:-card_issuer_control}?sslmode=disable&connect_timeout=2
      EXECUTOR_SHARD_DATABASE_URL: postgres://ci_app_executor:${EXECUTOR_DB_PASSWORD:-Dev-Executor-Runtime!2026}@postgres:5432/${SHARD_DATABASE:-card_issuer_shard_01}?sslmode=disable&connect_timeout=2
      EXECUTOR_SHARD_ID: ${SHARD_ID:-shard_01}
      EXECUTOR_POLL_INTERVAL: ${EXECUTOR_POLL_INTERVAL:-1s}
      EXECUTOR_MAX_CLAIMS: ${EXECUTOR_MAX_CLAIMS:-4}
      EXECUTOR_PER_BANK_CONCURRENCY: ${EXECUTOR_PER_BANK_CONCURRENCY:-1}
      EXECUTOR_LEASE_DURATION: ${EXECUTOR_LEASE_DURATION:-30s}
      EXECUTOR_BATCH_MAX_ATTEMPTS: ${EXECUTOR_BATCH_MAX_ATTEMPTS:-3}
      EXECUTOR_BATCH_INITIAL_BACKOFF: ${EXECUTOR_BATCH_INITIAL_BACKOFF:-1s}
      EXECUTOR_BATCH_MAX_BACKOFF: ${EXECUTOR_BATCH_MAX_BACKOFF:-30s}
      EXECUTOR_BATCH_SIZE_CAP: ${EXECUTOR_BATCH_SIZE_CAP:-200}
      EXECUTOR_EXPIRY_BACKOFF: ${EXECUTOR_EXPIRY_BACKOFF:-1s}
      EXECUTOR_DRAIN_TIMEOUT: ${EXECUTOR_DRAIN_TIMEOUT:-15s}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/card-issuer-executor", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]

  functional-tests:
    build:
      context: ./functional-tests
    profiles: ["functional"]
    environment:
      FUNCTIONAL_BASE_URL: http://app:8080
      FUNCTIONAL_PGHOST: postgres
      FUNCTIONAL_PGPORT: "5432"
      FUNCTIONAL_PGUSER: postgres
      FUNCTIONAL_PGPASSWORD: ${POSTGRES_PASSWORD:-Dev-Postgres-Admin!2026}
      FUNCTIONAL_CONTROL_DATABASE: ${CONTROL_DATABASE:-card_issuer_control}
      FUNCTIONAL_SHARD_DATABASE: ${SHARD_DATABASE:-card_issuer_shard_01}
      FUNCTIONAL_AUTHORIZATION_URL: https://authorization:8443
      FUNCTIONAL_AUTHORIZATION_BANK_ID: 10000000-0000-4000-8000-000000000001
      FUNCTIONAL_AUTHORIZATION_CA_FILE: /pki/server-ca.pem
      FUNCTIONAL_AUTHORIZATION_MAPPED_CERT_FILE: /pki/bank-client.pem
      FUNCTIONAL_AUTHORIZATION_MAPPED_KEY_FILE: /pki/bank-client-key.pem
      FUNCTIONAL_AUTHORIZATION_CLIENT_CA_CERT_FILE: /pki/client-ca.pem
      FUNCTIONAL_AUTHORIZATION_CLIENT_CA_KEY_FILE: /pki/client-ca-key.pem
    volumes:
      - ./.local/authorization-pki:/pki:ro
    depends_on:
      app:
        condition: service_healthy
      executor:
        condition: service_healthy
      authorization:
        condition: service_healthy
    restart: "no"
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  host-access:
    driver: bridge
  frontend:
    driver: bridge
